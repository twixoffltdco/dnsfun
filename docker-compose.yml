version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: openaccess-dns
    restart: unless-stopped
    volumes:
      - ./config/work:/opt/adguardhome/work
      - ./config/conf:/opt/adguardhome/conf
    ports:
      # Plain DNS
      - "53:53/tcp"
      - "53:53/udp"
      # DNS-over-TLS
      - "853:853/tcp"
      # DNS-over-HTTPS (and admin UI)
      - "3000:3000/tcp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      - TZ=Europe/Moscow
    networks:
      - dnsnet
    # Uncomment if you want host networking (sometimes needed for port 53)
    # network_mode: host

networks:
  dnsnet:
    driver: bridge

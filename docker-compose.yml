version: "3.8"

services:
  # Собственный bypass-резолвер (DoH/DoT upstreams + anti-poisoning + ECH)
  openaccess-resolver:
    image: python:3.12-alpine
    container_name: openaccess-resolver
    restart: unless-stopped
    volumes:
      - ./dns:/app/dns:ro
    command: >
      sh -c "python3 /app/dns/resolver.py --listen 0.0.0.0 --port 53 &
             python3 /app/dns/doh_server.py --listen 0.0.0.0 --port 8053"
    ports:
      - "5353:53/tcp"   # plain DNS без root-привилегий хоста (тест)
      - "5353:53/udp"
      - "8053:8053/tcp" # DoH endpoint (за Caddy/nginx с TLS)
    networks:
      - dnsnet

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: openaccess-dns
    restart: unless-stopped
    volumes:
      - ./config/work:/opt/adguardhome/work
      - ./config/conf:/opt/adguardhome/conf
    ports:
      # Plain DNS
      - "53:53/tcp"
      - "53:53/udp"
      # DNS-over-TLS
      - "853:853/tcp"
      # DNS-over-HTTPS (and admin UI)
      - "3000:3000/tcp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      - TZ=Europe/Moscow
    networks:
      - dnsnet
    # Uncomment if you want host networking (sometimes needed for port 53)
    # network_mode: host

networks:
  dnsnet:
    driver: bridge
